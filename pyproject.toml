[project]
name = "google-adk-project"
version = "0.1.0"
description = "Example agents built with the Google Agent Development Kit (ADK)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.14.0",
    "langchain-tavily>=0.2.18",
    "litellm>=1.108.4",
]

[project.scripts]
google-adk-project = "google_adk_project:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
